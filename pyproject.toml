[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ge-betting-research"
version = "0.1.0"
description = "Research code for Gaussian-efficient betting inference on bounded means"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Diego Martinez-Taboada"},
  {name = "Aaditya Ramdas"},
]
dependencies = [
  "matplotlib>=3.8",
  "numba>=0.59",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "tqdm>=4.66",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[tool.setuptools]
py-modules = [
  "betting",
  "confidence_sequences",
  "legacy_constructions",
  "robust_studentized_dp",
  "wor",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["plots", "gaffke_comparison/*_results*"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
